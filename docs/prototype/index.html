<!doctype html>
<html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoSenim — сайт прототипі</title><style>
:root{--ink:#192e36;--muted:#64757b;--paper:#f5f5ef;--line:#d9e0db;--accent:#d9ed74;--white:#fff;--green:#236148}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Arial,Helvetica,sans-serif}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:11px 17px;background:white;color:var(--ink);min-height:44px}button:hover{border-color:var(--ink)}button:disabled{opacity:.5;cursor:not-allowed}.primary{background:var(--ink);color:white;border-color:var(--ink)}.lime{background:var(--accent);border-color:var(--accent)}.ghost{background:transparent}.danger{color:#a53628}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #3188b9;outline-offset:3px}header{max-width:1200px;margin:auto;padding:25px 28px;display:flex;align-items:center;justify-content:space-between;gap:18px}.logo{font-size:24px;font-weight:800;letter-spacing:-1px;text-decoration:none}.logo b{background:var(--accent);border-radius:8px;padding:3px 8px;margin-right:7px}.links{display:flex;gap:9px;flex-wrap:wrap}main{max-width:1200px;margin:0 auto;padding:20px 28px 64px}.demo{padding:10px 28px;background:#e6eae3;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;flex-wrap:wrap}.demo select{padding:6px;background:white;border:1px solid #b9c5bb;border-radius:6px}.demo button{padding:4px 10px;min-height:34px;font-size:13px}.hero{display:grid;grid-template-columns:1.4fr 1fr;background:var(--ink);color:#fff;border-radius:22px;overflow:hidden;margin-bottom:32px}.hero>div{padding:46px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:12px;font-weight:700;color:var(--muted)}.hero .eyebrow{color:var(--accent)}h1{font-size:clamp(32px,4.4vw,58px);letter-spacing:-2px;line-height:1.1;margin:18px 0 20px}h2{font-size:27px;letter-spacing:-.6px;line-height:1.2}h3{font-size:20px;margin:0 0 8px}.hero p{max-width:500px;color:#d0dce0}.hero .process{background:#28424a;display:flex;flex-direction:column;justify-content:center;gap:23px}.step{display:flex;gap:18px;align-items:center}.step span{color:var(--accent);font-size:22px;border:1px solid #5b7077;padding:6px 12px;border-radius:50%}.step small{display:block;color:#bacbd0}.search{background:white;padding:22px;border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:1fr 1fr auto;align-items:end;gap:14px;margin:20px 0 30px}label{display:block;font-size:14px;font-weight:600}input,select,textarea{width:100%;padding:12px;border:1px solid #bbc8c3;border-radius:8px;background:white;color:var(--ink);margin-top:7px}textarea{min-height:110px;resize:vertical}.demo label{display:flex;align-items:center;gap:8px;font-size:13px}.demo select{width:auto;margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:25px}.avatar{width:64px;height:64px;border-radius:14px;background:#e4eadc;display:grid;place-items:center;font-size:22px;font-weight:700;flex-shrink:0}.person{display:flex;gap:15px;align-items:center;margin-bottom:20px}.muted{color:var(--muted)}.tiny{font-size:13px}.pill{display:inline-block;background:#e8f2e8;color:#265844;padding:4px 9px;border-radius:6px;font-size:12px;font-weight:600}.rating{font-weight:700;margin:18px 0}.rating span{font-weight:400;color:var(--muted);font-size:14px}.card .full{width:100%;margin-top:18px}.row{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.stack{display:grid;gap:16px}.split{display:grid;grid-template-columns:1.7fr 1fr;gap:24px}.profilehead{display:flex;align-items:center;gap:22px;margin:20px 0 28px}.profilehead h1{font-size:38px;margin:0 0 7px}.profilehead .avatar{width:100px;height:100px;font-size:34px}.review{padding:20px 0;border-bottom:1px solid var(--line)}.review:last-child{border-bottom:0}.form{max-width:620px}.form label{margin-bottom:15px}.note{padding:16px 20px;border-left:3px solid #719a57;background:#edf2e5;font-size:14px;margin:20px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.status{display:inline-block;border-radius:20px;background:#edf1f4;padding:5px 11px;font-size:13px}.done{background:#e4f2df;color:#285339}.empty{padding:45px;text-align:center;border:1px dashed #aabbb0;border-radius:14px}.history{font-size:13px;color:var(--muted);margin-top:18px;border-top:1px solid var(--line);padding-top:14px}.stats{display:flex;gap:30px;margin:20px 0}.stats strong{display:block;font-size:30px}.notification{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:14px 22px;border-radius:10px;max-width:90vw;box-shadow:0 8px 35px #0003;z-index:9}.notification:empty{display:none}footer{max-width:1144px;margin:auto;border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:13px}.back{border:0;background:transparent;padding-left:0}.bad{color:#a53628}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:15px}dialog{border:1px solid var(--line);border-radius:18px;padding:28px;width:min(540px,92vw);color:var(--ink)}dialog::backdrop{background:#11252c88}dialog h2{margin-top:0}summary{cursor:pointer}small{font-size:13px} [hidden]{display:none!important}@media(max-width:850px){.hero{grid-template-columns:1fr}.hero>div{padding:30px}.hero .process{display:none}.grid{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}.search{grid-template-columns:1fr 1fr}.search button{grid-column:1/-1}header{align-items:flex-start}footer{margin:0 24px}}@media(max-width:540px){.grid,.twocol{grid-template-columns:1fr}.demo,header{padding:14px 18px}header{flex-direction:column}.links{width:100%}.links button{flex:1;padding:9px}main{padding:12px 18px 40px}.hero>div{padding:26px}h1{letter-spacing:-1px}.search{grid-template-columns:1fr;padding:18px}.card{padding:20px}.profilehead{align-items:flex-start}.profilehead h1{font-size:29px}.profilehead .avatar{width:65px;height:65px;font-size:24px}.stats{gap:20px}.row{align-items:flex-start}}
</style></head><body>
<div class="demo"><span>ИНТЕРАКТИВТІ ПРОТОТИП · Барлық мамандар мен пікірлер — үлгі деректер</span><div class="links"><label>Көрініс <select id="role"><option value="visitor">Қонақ</option><option value="customer">Клиент</option><option value="specialist">Маман</option><option value="admin">Әкімші</option></select></label><button id="reset">Қайта бастау</button></div></div>
<header><a class="logo" href="#home"><b>A</b>AutoSenim</a><nav class="links" aria-label="Негізгі навигация"><button data-nav="home">Маман іздеу</button><button data-nav="dashboard">Жеке кабинет</button><button id="authButton">Кіру</button></nav></header>
<main id="app"></main><footer>Диплом жобасының прототипі · Dastan · Баға мен жөндеу уақыты маманмен келісіледі.</footer><div id="toast" class="notification" role="status" aria-live="polite"></div><dialog id="modal"></dialog>
<script>
'use strict';
const $=s=>document.querySelector(s);const app=$('#app');const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const people=[{id:1,name:'Аян С.',city:'Алматы',service:'Автоэлектрика',initials:'АС',about:'Автокөліктің электр жүйесін диагностикалау және жөндеу. Жұмыс көлемі тексеруден кейін келісіледі.'},{id:2,name:'Дамир К.',city:'Астана',service:'Диагностика',initials:'ДК',about:'Қозғалтқыш пен басқару жүйелерін тексеру. Диагностика нәтижесін түсіндіру.'},{id:3,name:'Темір сервис',city:'Алматы',service:'Май ауыстыру',initials:'ТС',about:'Май мен сүзгілерді ауыстыру. Қажетті материалдарды маманмен алдын ала келісіңіз.'}];
let role='visitor',page='home',selected=1,city='',service='',requests=[],reviews=[],complaints=[],counter=200;
const names={new:'Жаңа',accepted:'Қабылданды',progress:'Жұмыс жүріп жатыр',awaiting:'Растауды күтуде',completed:'Аяқталды',disputed:'Аяқталуы даулы',declined:'Қабылданбады',cancelled:'Тоқтатылды'};
function reset(){requests=[{id:101,sid:1,car:'Toyota Camry',problem:'Үлгі тапсырыс: аккумуляторды тексеру',status:'awaiting',history:['Өтінім жіберілді','Маман жұмысты аяқтады'],owner:'Dastan'}];reviews=[{id:1,sid:1,score:5,text:'Мәселені түсіндіріп, келісілген жұмысты орындады.',author:'Клиент A',rid:'demo-1',visible:true},{id:2,sid:1,score:4,text:'Жөндеу орындалды, бірақ күткеннен ұзаққа созылды.',author:'Клиент B',rid:'demo-2',visible:true},{id:3,sid:2,score:4,text:'Диагностика нәтижесін түсіндірді.',author:'Клиент C',rid:'demo-3',visible:true}];complaints=[];counter=200;role='visitor';page='home';selected=1;city='';service='';$('#role').value=role;render()}
const person=id=>people.find(p=>p.id===Number(id));const rating=id=>{const r=reviews.filter(x=>x.sid===id&&x.visible);return r.length?`${(r.reduce((a,b)=>a+b.score,0)/r.length).toFixed(1)} <span>· ${r.length} пікір</span>`:'<span>Әзірге бағаланбаған</span>'};
function notify(t){$('#toast').textContent=t;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').textContent='',4000)}
function nav(p){page=p;render();window.scrollTo({top:0,behavior:'instant'})}
function setRole(r){role=r;$('#role').value=r;$('#authButton').textContent=r==='visitor'?'Кіру':'Шығу'}
function card(p){return `<article class="card"><div class="person"><div class="avatar">${p.initials}</div><div><h3>${esc(p.name)}</h3><div class="muted tiny">${p.city} · ${p.service}</div></div></div><span class="pill">Қызметі көрсетілген профиль</span><div class="rating">★ ${rating(p.id)}</div><p class="muted">${esc(p.about)}</p><button class="full" data-profile="${p.id}">Профильді қарау →</button></article>`}
function home(){return `<section class="hero"><div><div class="eyebrow">Автокөлік жөндеу мамандары</div><h1>Көлігіңізге<br>лайық маман.</h1><p>Мамандарды салыстырыңыз. Қызметке өтінім беріңіз. Аяқталған тапсырысқа пікір қалдырыңыз.</p><button class="lime" id="startSearch">Маман табу ↓</button></div><div class="process"><div class="step"><span>01</span><div>Маманды таңдаңыз<small>Қала, қызмет және клиент пікірлері</small></div></div><div class="step"><span>02</span><div>Өтінім жіберіңіз<small>Көлігіңіздің мәселесін сипаттаңыз</small></div></div><div class="step"><span>03</span><div>Тәжірибеңізді бөлісіңіз<small>Қызмет аяқталғаннан кейін</small></div></div></div></section><form class="search" id="searchForm"><label>Қала<select name="city"><option value="">Барлық қалалар</option><option ${city==='Алматы'?'selected':''}>Алматы</option><option ${city==='Астана'?'selected':''}>Астана</option></select></label><label>Қызмет<select name="service"><option value="">Барлық қызметтер</option><option ${service==='Автоэлектрика'?'selected':''}>Автоэлектрика</option><option ${service==='Диагностика'?'selected':''}>Диагностика</option><option ${service==='Май ауыстыру'?'selected':''}>Май ауыстыру</option></select></label><button class="primary">Іздеу</button></form><div class="row"><h2>Жөндеу мамандары</h2><span class="muted tiny">Рейтинг бойынша · Үлгі каталог</span></div><div class="grid">${people.filter(p=>(!city||p.city===city)&&(!service||p.service===service)).sort((a,b)=>avg(b.id)-avg(a.id)||count(b.id)-count(a.id)).map(card).join('')||'<div class="empty">Маман табылмады. Қала немесе қызмет сүзгісін өзгертіңіз.</div>'}</div>`}
function avg(id){const r=reviews.filter(x=>x.sid===id&&x.visible);return r.length?r.reduce((s,x)=>s+x.score,0)/r.length:-1}function count(id){return reviews.filter(x=>x.sid===id&&x.visible).length}
function profile(){const p=person(selected);return `<button class="back" data-nav="home">← Іздеуге оралу</button><div class="profilehead"><div class="avatar">${p.initials}</div><div><div class="eyebrow">${p.city} · ${p.service}</div><h1>${esc(p.name)}</h1><div class="rating">★ ${rating(p.id)}</div></div></div><div class="split"><div class="stack"><section class="card"><h2>Маман туралы</h2><p>${esc(p.about)}</p><span class="pill">${p.service}</span></section><section class="card"><h2>Клиент пікірлері</h2><p class="muted tiny">«Расталған» белгісі пікірдің аяқталған тапсырыспен байланысын көрсетеді.</p>${reviews.filter(r=>r.sid===selected&&r.visible).map(r=>`<div class="review"><div class="row"><strong>${esc(r.author)} · ${r.score}/5</strong><span class="pill">Тапсырыс расталған</span></div><p>${esc(r.text)}</p><button class="ghost" data-report="review:${r.id}">Шағым беру</button></div>`).join('')||'<p class="muted">Бұл маманға әзірге пікір қалдырылмаған.</p>'}</section></div><aside><div class="card"><h3>Қызметке өтінім</h3><p class="muted">Көлігіңіз бен мәселеңізді сипаттаңыз. Баға мен уақытты маманмен келісесіз.</p><button class="primary full" id="requestButton">Өтінім беру</button><p class="tiny muted">Сайтта онлайн төлем қарастырылмаған.</p></div><div class="note">Қызметтің аяқталғанын өзіңіз растайсыз. Содан кейін баға мен пікір қалдыруға болады.</div></aside></div>`}
function requestForm(){return `<button class="back" data-nav="profile">← Маман профилі</button><div class="form"><div class="eyebrow">${esc(person(selected).name)}</div><h1>Өтінім беру</h1><form id="requestForm" class="card"><div class="twocol"><label>Көлік маркасы<input name="make" required maxlength="40" placeholder="Toyota"></label><label>Моделі<input name="model" required maxlength="40" placeholder="Camry"></label></div><label>Мәселенің сипаттамасы<textarea name="problem" required maxlength="1000" placeholder="Көлігіңізде қандай мәселе бар?"></textarea></label><label>Байланыс нөмірі<input name="phone" type="tel" required maxlength="30" placeholder="Прототип үшін үлгі нөмір енгізіңіз"></label><p class="tiny muted">Бұл прототипте өтінім ешкімге жіберілмейді. Нақты жеке деректерді енгізбеңіз.</p><button class="primary">Өтінімді жіберу</button></form></div>`}
function actionButtons(r){let s='';if(role==='customer'){if(['new','accepted'].includes(r.status))s+=`<button data-transition="${r.id}:cancelled">Тоқтату</button>`;if(['awaiting','disputed'].includes(r.status))s+=`<button class="primary" data-transition="${r.id}:completed">Қызмет аяқталды</button>`;if(r.status==='awaiting')s+=`<button data-transition="${r.id}:disputed">Аяқталуымен келіспеймін</button>`;if(r.status==='completed')s+=reviews.some(x=>x.rid===r.id)?'<span class="pill">Пікір қалдырылды</span>':`<button class="primary" data-review="${r.id}">Пікір қалдыру</button>`;}if(role==='specialist'){const next={new:['accepted','declined'],accepted:['progress','cancelled'],progress:['awaiting'],disputed:['progress']}[r.status]||[];s+=next.map(n=>`<button data-transition="${r.id}:${n}" class="${['accepted','progress','awaiting'].includes(n)?'primary':''}">${{accepted:'Қабылдау',declined:'Қабылдамау',progress:'Жұмысты бастау',cancelled:'Тоқтату',awaiting:'Жұмыс аяқталды'}[n]}</button>`).join('')}return s+`<button class="ghost" data-report="request:${r.id}">Шағым беру</button>`}
function dashboards(){if(role==='visitor')return `<div class="empty"><h2>Жеке кабинетке кіріңіз</h2><p>Өтінімдеріңізді бақылау үшін клиент көрінісін таңдаңыз.</p><button class="primary" id="login">Демо кіру</button></div>`;if(role==='admin')return admin();let list=role==='specialist'?requests.filter(r=>r.sid===selected):requests;return `<div class="row"><div><div class="eyebrow">${role==='customer'?'Клиент · Dastan':'Маман · '+esc(person(selected).name)}</div><h1>${role==='customer'?'Менің өтінімдерім':'Келген өтінімдер'}</h1></div>${role==='specialist'?'<button id="editProfile">Профильді өңдеу</button>':'<button data-nav="home">+ Маман іздеу</button>'}</div><div class="stats"><div><strong>${list.length}</strong><span class="muted">Барлық өтінім</span></div><div><strong>${list.filter(r=>r.status==='completed').length}</strong><span class="muted">Аяқталған</span></div></div><div class="stack">${list.map(r=>`<article class="card"><div class="row"><div><small class="muted">№${r.id} · ${esc(person(r.sid).name)}</small><h3>${esc(r.car)}</h3></div><span class="status ${r.status==='completed'?'done':''}">${names[r.status]}</span></div><p>${esc(r.problem)}</p>${r.status==='awaiting'?'<div class="note">Растау қызметтің орындалғанын білдіреді. Қызмет сапасын кейін пікірде бағалайсыз.</div>':''}<div class="actions">${actionButtons(r)}</div><details class="history"><summary>Өзгерістер тарихы</summary><ol>${r.history.map(h=>`<li>${esc(h)}</li>`).join('')}</ol></details></article>`).join('')||'<div class="empty">Әзірге өтінім жоқ.</div>'}</div><h2>Менің шағымдарым</h2>${complaints.filter(c=>c.author===role).map(c=>`<div class="card"><strong>№${c.id} · ${c.state}</strong><p>${esc(c.reason)}</p>${c.decision?'<p>Шешім: '+esc(c.decision)+'</p>':''}</div>`).join('')||'<p class="muted">Шағым жіберілмеген.</p>'}`}
function admin(){return `<div class="eyebrow">Әкімші</div><h1>Шағымдарды қарау</h1><p class="muted">Төмен баға өздігінен пікірді жасыруға себеп емес.</p><div class="stack">${complaints.map(c=>`<article class="card"><div class="row"><h3>Шағым №${c.id}</h3><span class="status">${c.state}</span></div><p>${esc(c.reason)}</p><p class="tiny muted">Нысан: ${esc(c.target)}</p>${c.decision?'<p>Шешім: '+esc(c.decision)+'</p>':`<button data-resolve="${c.id}">Шешім қабылдау</button>`}</article>`).join('')||'<div class="empty">Ашық шағым жоқ. Клиент не маман көрінісінде шағым жіберіп көріңіз.</div>'}</div>`}
function modal(html){$('#modal').innerHTML=html;$('#modal').showModal()}
function auth(after='dashboard'){modal(`<h2>Прототипке кіру</h2><p>Бұл — интерфейс үлгісі. Нақты тіркелу мен пароль тексеру қосылмаған.</p><form id="demoLogin"><label>Рөліңіз<select name="role"><option value="customer">Клиент</option><option value="specialist">Маман</option></select></label><div class="actions"><button class="primary">Демо кіру</button><button type="button" data-close>Жабу</button></div></form>`);$('#demoLogin').onsubmit=e=>{e.preventDefault();setRole(new FormData(e.target).get('role'));$('#modal').close();nav(after==='request'&&role!=='customer'?'dashboard':after)}}
function render(){ $('#authButton').textContent=role==='visitor'?'Кіру':'Шығу';app.innerHTML=page==='home'?home():page==='profile'?profile():page==='request'?requestForm():dashboards();if($('#searchForm'))$('#searchForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);city=f.get('city');service=f.get('service');render();$('#searchForm').scrollIntoView()};if($('#requestForm'))$('#requestForm').onsubmit=e=>{e.preventDefault();if(role!=='customer')return;const f=new FormData(e.target);if(!String(f.get('problem')).trim())return notify('Мәселені сипаттаңыз');requests.unshift({id:++counter,sid:selected,car:f.get('make')+' '+f.get('model'),problem:f.get('problem'),status:'new',history:['Клиент өтінім жіберді'],owner:'Dastan'});nav('dashboard');notify('Өтінім прототипке қосылды')};}
function transition(id,next){const r=requests.find(x=>x.id===id);if(!r)return;const allowed=role==='customer'?{new:['cancelled'],accepted:['cancelled'],awaiting:['completed','disputed'],disputed:['completed']}:{new:['accepted','declined'],accepted:['progress','cancelled'],progress:['awaiting'],disputed:['progress']};if(!['customer','specialist'].includes(role)||!(allowed[r.status]||[]).includes(next)||(role==='specialist'&&r.sid!==selected))return notify('Бұл әрекетке рұқсат жоқ');function apply(reason=''){r.status=next;r.history.push((role==='customer'?'Клиент':'Маман')+': '+names[next]+(reason?' — '+reason:''));render()}if(['cancelled','declined','disputed'].includes(next)){modal('<h2>Себебін жазыңыз</h2><form id="reason"><label>Себеп<textarea name="reason" required maxlength="600"></textarea></label><div class="actions"><button class="primary">Сақтау</button><button type="button" data-close>Бас тарту</button></div></form>');$('#reason').onsubmit=e=>{e.preventDefault();let v=new FormData(e.target).get('reason').trim();if(!v)return;$('#modal').close();apply(v)}}else apply()}
function review(id){const r=requests.find(x=>x.id===id);if(role!=='customer'||!r||r.status!=='completed'||reviews.some(x=>x.rid===id))return notify('Пікір қалдыру шарты орындалмаған');modal(`<h2>Қызметті бағалаңыз</h2><p class="muted">${esc(person(r.sid).name)} · №${r.id}</p><form id="reviewForm"><label>Баға<select name="score"><option value="5">5 — Өте жақсы</option><option value="4">4 — Жақсы</option><option value="3">3 — Орташа</option><option value="2">2 — Нашар</option><option value="1">1 — Өте нашар</option></select></label><label>Пікір<textarea required name="text" maxlength="1000"></textarea></label><div class="actions"><button class="primary">Пікірді жариялау</button><button type="button" data-close>Бас тарту</button></div></form>`);$('#reviewForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(!f.get('text').trim()||reviews.some(x=>x.rid===id))return;reviews.push({id:++counter,rid:id,sid:r.sid,score:Number(f.get('score')),text:f.get('text'),author:'Dastan',visible:true});$('#modal').close();render();notify('Пікір қосылды. Рейтинг жаңарды.')}}
function report(target){if(role==='visitor')return auth('profile');modal('<h2>Шағым беру</h2><form id="complaintForm"><label>Мәселені сипаттаңыз<textarea name="reason" required maxlength="1000"></textarea></label><div class="actions"><button class="primary">Жіберу</button><button type="button" data-close>Бас тарту</button></div></form>');$('#complaintForm').onsubmit=e=>{e.preventDefault();let reason=new FormData(e.target).get('reason').trim();if(!reason)return;complaints.push({id:++counter,target,reason,author:role,state:'Ашық',decision:''});$('#modal').close();render();notify('Шағым прототипке тіркелді')}}
function resolve(id){if(role!=='admin')return;let c=complaints.find(x=>x.id===id);if(!c||c.decision)return;modal(`<h2>Шағым бойынша шешім</h2><form id="resolveForm"><label>Шешім<select name="state"><option>Шешілді</option><option>Қабылданбады</option></select></label><label>Негіздеме<textarea required name="decision" maxlength="1000"></textarea></label>${c.target.startsWith('review:')?'<label><input type="checkbox" name="hide" style="width:auto"> Ереже бұзған пікірді жасыру</label>':''}<div class="actions"><button class="primary">Шешімді сақтау</button><button type="button" data-close>Бас тарту</button></div></form>`);$('#resolveForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);if(!f.get('decision').trim())return;if(f.get('hide')&&f.get('state')==='Қабылданбады')return notify('Шағымды қабылдамай, пікірді жасыруға болмайды');c.state=f.get('state');c.decision=f.get('decision');if(f.get('hide')){let r=reviews.find(x=>x.id===Number(c.target.split(':')[1]));if(r)r.visible=false}$('#modal').close();render();notify('Шешім сақталды')}}
document.addEventListener('click',e=>{let b=e.target.closest('button,a');if(!b)return;if(b.dataset.close!==undefined){$('#modal').close();return}if(b.classList.contains('logo')){e.preventDefault();nav('home')}if(b.dataset.nav)nav(b.dataset.nav);if(b.dataset.profile){selected=Number(b.dataset.profile);nav('profile')}if(b.id==='startSearch')$('#searchForm').scrollIntoView({behavior:'smooth'});if(b.id==='requestButton'){if(role==='visitor')auth('request');else if(role==='customer')nav('request');else notify('Өтінімді клиент көрінісінде жіберіңіз')}if(b.id==='login')auth();if(b.id==='authButton'){if(role==='visitor')auth();else{setRole('visitor');nav('home')}}if(b.dataset.transition){let [id,n]=b.dataset.transition.split(':');transition(Number(id),n)}if(b.dataset.review)review(Number(b.dataset.review));if(b.dataset.report)report(b.dataset.report);if(b.dataset.resolve)resolve(Number(b.dataset.resolve));if(b.id==='editProfile'){let p=person(selected);modal(`<h2>Профильді өңдеу</h2><form id="profileForm"><label>Сипаттама<textarea name="about" required maxlength="700">${esc(p.about)}</textarea></label><div class="actions"><button class="primary">Сақтау</button><button type="button" data-close>Бас тарту</button></div></form>`);$('#profileForm').onsubmit=e=>{e.preventDefault();let v=new FormData(e.target).get('about').trim();if(!v)return;p.about=v;$('#modal').close();notify('Сипаттама осы прототип сессиясында жаңарды')}}});$('#role').onchange=e=>{setRole(e.target.value);nav(role==='visitor'?'home':'dashboard')};$('#reset').onclick=reset;reset();
</script></body></html>
