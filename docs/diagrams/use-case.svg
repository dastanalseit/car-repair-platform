<line x1="185" y1="1065" x2="487" y2="845" stroke="#60788b" stroke-width="1.7"/><text x="55" y="1491" class="small">Review rule: only the request owner may review after customer-confirmed completion.</text>
<text x="55" y="1518" class="small">One review per request. Confirmation does not imply satisfaction; negative reviews are allowed.</text>
<text x="55" y="1545" class="small">Signed-in roles can also browse public content. Associations show access, not execution order.</text>
